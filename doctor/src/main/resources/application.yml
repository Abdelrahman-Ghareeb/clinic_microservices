spring:
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
  application:
    name: doctor-service
  datasource:
    url: jdbc:h2:file:./database/doctor
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: true
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: update
server:
  port: 9999
  servlet:
    context-path: /doctor

