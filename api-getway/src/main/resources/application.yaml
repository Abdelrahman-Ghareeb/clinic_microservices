server:
  port: 7771

spring:
  application:
    name: api-getway

  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/

  cloud:
    gateway:
      discover:
        locator:
          enable: true
          lower-case-service-id: true

  main:
    web-application-type: reactive





