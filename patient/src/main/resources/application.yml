spring:
  boot:
    admin:
      client:
        url: http://localhost:4444
  eureka:
    client:
      service-url:
        defaultZone: http://localhost:8761/eureka/
  application:
    name: patient-service
  datasource:
    url: jdbc:h2:file:./database/patient;AUTO_SERVER=TRUE
    username: sa
    password: password
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        trace: true
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: update
server:
  port: 8881
  servlet:
    context-path: /patient

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    show-details: always

